## /etc/systemd/journald.conf - Configuration for systemd `journalctl`
##
## Local configuration should be created by either modifying this file, or
## by creating "drop-ins" in the /etc/systemd/journald.conf.d/ subdirectory.
## Defaults can be restored by simply deleting this file and all drop-ins.

### NOTE The following comment-lines are the compile time defaults ###
## `systemd-analyze cat-config systemd/journald.conf` to show  configs

[Journal]
#Storage=auto
#Compress=yes
#Seal=yes
#SplitMode=uid
#SyncIntervalSec=5m
#RateLimitIntervalSec=30s
#RateLimitBurst=10000

SystemMaxUse=1G
#SystemKeepFree=
#SystemMaxFileSize=
#SystemMaxFiles=100

RuntimeMaxUse=256M
#RuntimeKeepFree=
#RuntimeMaxFileSize=
#RuntimeMaxFiles=100

#MaxRetentionSec=
#MaxFileSec=1month

#ForwardToSyslog=no
#ForwardToKMsg=no
#ForwardToConsole=no
#ForwardToWall=yes
#TTYPath=/dev/console

#MaxLevelStore=debug
#MaxLevelSyslog=debug
#MaxLevelKMsg=notice
#MaxLevelConsole=info
#MaxLevelWall=emerg

#LineMax=48K
#ReadKMsg=yes
#Audit=yes
