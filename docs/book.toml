[book]
title = "Zeta"
authors = ["Charles Wong"]
description = "Personal Terminal and System Configurations."
language = "en"
text-direction = "ltr"
src = "contents"

[build]
build-dir = "website" # directory where the output is placed
create-missing = true # 创建 SUMMARY.md 缺失的 Markdown 页面
use-default-preprocessors = true
extra-watch-dirs = [ "plugins" ]

[output.html]
theme = "theme"
default-theme = "light"
preferred-dark-theme = "navy"

# GitHub Flavored Markdown Alerts
admonitions = true
# 站点 404 页面
input-404 = "404.md"
# 定义列表(术语表)
definition-lists = true
# 智能标点替换 ASCII -> Unicode
smart-punctuation = true
# 数学公式 https://www.mathjax.org
mathjax-support = false
# 左侧导航栏添加数字编号标签
no-section-label = false
# 左侧导航拦显示页面内子标题
sidebar-header-nav = true
# Mermaid required JS files generated by `mdbook-mermaid`
additional-js = [ "assets/mermaid.min.js", "assets/mermaid-init.js" ]

site-url = "/zeta/"
git-repository-icon = "fab-github"
git-repository-url = "https://github.com/charlie-wong/zeta"
edit-url-template = "https://github.com/charlie-wong/zeta/edit/trunk/contents/{path}"

[output.html.print]
enable = false    # include support for printable output
page-break = true # insert page-break after each chapter

[output.html.fold]
enable = true     # section folding enable or not
level = 0         # 0 全部折叠，数字越大折叠越少

[output.html.playground]
editable = false      # allows editing the source code
copyable = true       # include copy button for copying code snippets
copy-js = true        # include the JavaScript for the code editor
line-numbers = false  # display line numbers for editable code
runnable = false      # display a run button for rust code

[output.html.code.hidelines]
# A prefix string per language (one or more chars).
# Any line starting with whitespace+prefix is hidden.
python = "~"

[output.html.search]
enable = true            # enables the search feature
limit-results = 30       # maximum number of search results
teaser-word-count = 30   # number of words used for search result teaser
use-boolean-and = false  # multiple search terms must all match
boost-title = 3          # ranking boost factor for matches in headers
boost-hierarchy = 2      # ranking boost factor for matches in page names
boost-paragraph = 1      # ranking boost factor for matches in normal text
expand = true            # partial words will match longer terms
heading-split-level = 3  # link results to heading levels
copy-js = true           # include Javascript code for search

[preprocessor.mermaid]
command = "mdbook-mermaid"
